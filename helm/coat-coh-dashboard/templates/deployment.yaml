{{- $root := . -}}
{{- range $key, $dashboard := .Values.app.deployment.dashboards }}
{{- $context := dict "root" $root "key" $key "dashboard" $dashboard }}
{{- $basePath := default $dashboard.name $dashboard.basePath | trimAll "/" }}
{{- $env := mergeOverwrite (deepCopy (default (dict) $root.Values.app.deployment.env)) (default (dict) $dashboard.env) }}
{{- $_ := set $env "APP_BASE_URL" (printf "https://%s/%s" $root.Values.app.ingress.primaryHost $basePath) }}
{{- $_ := set $env "STREAMLIT_SERVER_BASE_URL_PATH" $basePath }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "application.dashboard.fullname" $context }}
  labels:
    {{- include "application.dashboard.labels" $context | nindent 4 }}
spec:
  replicas: {{ $dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "application.dashboard.selectorLabels" $context | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "application.dashboard.selectorLabels" $context | nindent 8 }}
    spec:
      serviceAccountName: {{ $dashboard.serviceAccountName | quote }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $dashboard.name | quote }}
          image: "{{ $dashboard.image.repository }}:{{ $dashboard.image.tag | default $root.Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          env:
            {{- range $name, $value := $env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $root.Values.app.service.targetPort }}
{{- end }}