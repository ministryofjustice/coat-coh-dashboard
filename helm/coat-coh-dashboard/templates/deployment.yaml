        - name: showback-report
          image: "{{ .Values.app.deployment.showback_report.image.repository }}:{{ .Values.app.deployment.showback_report.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: AUTH0_CLIENT_ID
