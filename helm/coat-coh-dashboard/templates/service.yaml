apiVersion: v1
kind: Service
metadata:
  name: showback-report
  labels:
    helm.sh/chart: coat-coh-dashboard-0.1.0
    app.kubernetes.io/name: showback-report
    app.kubernetes.io/instance: showback-report
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  ports:
    - port: 80
      targetPort: 8501
      name: https
  selector:
    app.kubernetes.io/name: showback-report
    app.kubernetes.io/instance: showback-report