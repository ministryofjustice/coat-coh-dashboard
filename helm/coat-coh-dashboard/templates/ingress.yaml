{{- $root := . -}}
{{- $fullName := include "application.fullname" . -}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
  annotations:
    external-dns.alpha.kubernetes.io/set-identifier: {{ $fullName }}-{{ $fullName }}-green
    external-dns.alpha.kubernetes.io/aws-weight: "100"
    cloud-platform.justice.gov.uk/ignore-external-dns-weight: "true"
spec:
  ingressClassName: "default"
  tls:
    - hosts:
        - {{ .Values.app.ingress.primaryHost }}
      secretName: "cmcaicu-prod-cert"
  rules:
    - host: {{ .Values.app.ingress.primaryHost }}
      http:
        paths:
          {{- range $key, $dashboard := .Values.app.deployment.dashboards }}
          {{- $context := dict "root" $root "key" $key "dashboard" $dashboard }}
          {{- $basePath := default $dashboard.name $dashboard.basePath | trimAll "/" }}
          - path: {{ printf "/%s" $basePath }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "application.dashboard.fullname" $context }}
                port:
                  number: {{ $root.Values.app.service.port }}
          {{- end }}